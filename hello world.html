<html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0b0b12, #171321, #241b30);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 34px;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .header p {
            margin-top: 8px;
            color: #b8a9c9;
            font-size: 14px;
        }

        .line {
            width: 60px;
            height: 3px;
            background: #9b72cf;
            margin: 15px auto;
            border-radius: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .input-box {
            display: flex;
            flex-direction: column;
        }

        .input-box.full {
            grid-column: span 2;
        }

        label {
            margin-bottom: 8px;
            font-size: 14px;
            color: #d9d0e2;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.25);
            color: white;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #9b72cf;
            box-shadow: 0 0 12px rgba(155,114,207,0.25);
        }

        select option {
            background: #171321;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .gender {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }

        .gender label {
            display: flex;
            align-items: center;
            gap: 7px;
            cursor: pointer;
        }

        .gender input {
            width: auto;
            accent-color: #9b72cf;
        }

        .submit-btn {
            grid-column: span 2;
            margin-top: 10px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #9b72cf, #684a91);
            color: white;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(155,114,207,0.3);
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #8e839a;
            font-size: 12px;
        }

        @media (max-width: 650px) {
            .container {
                padding: 25px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .input-box.full,
            .submit-btn {
                grid-column: span 1;
            }

            .header h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Student Registration</h1>
            <div class="line"></div>
            <p>Academic Year 2026 – 2027</p>
        </div>

        <form id="studentForm">

            <div class="form-grid">

                <div class="input-box">
                    <label>First Name</label>
                    <input type="text" placeholder="Enter first name" required>
                </div>

                <div class="input-box">
                    <label>Last Name</label>
                    <input type="text" placeholder="Enter last name" required>
                </div>

                <div class="input-box">
                    <label>Date of Birth</label>
                    <input type="date" required>
                </div>

                <div class="input-box">
                    <label>Gender</label>
                    <div class="gender">
                        <label>
                            <input type="radio" name="gender" required>
                            Male
                        </label>

                        <label>
                            <input type="radio" name="gender">
                            Female
                        </label>

                        <label>
                            <input type="radio" name="gender">
                            Other
                        </label>
                    </div>
                </div>

                <div class="input-box">
                    <label>Email Address</label>
                    <input type="email" placeholder="student@email.com" required>
                </div>

                <div class="input-box">
                    <label>Phone Number</label>
                    <input type="tel" placeholder="+91 XXXXX XXXXX" required>
                </div>

                <div class="input-box">
                    <label>Course</label>
                    <select required>
                        <option value="">Select Course</option>
                        <option>Computer Science</option>
                        <option>Information Technology</option>
                        <option>Electronics & Telecommunication</option>
                        <option>Artificial Intelligence</option>
                        <option>Data Science</option>
                        <option>Mechanical Engineering</option>
                    </select>
                </div>

                <div class="input-box">
                    <label>Year / Semester</label>
                    <select required>
                        <option value="">Select</option>
                        <option>First Year</option>
                        <option>Second Year</option>
                        <option>Third Year</option>
                        <option>Final Year</option>
                    </select>
                </div>

                <div class="input-box full">
                    <label>Student ID</label>
                    <input type="text" placeholder="Enter student ID" required>
                </div>

                <div class="input-box full">
                    <label>Address</label>
                    <textarea placeholder="Enter your complete address" required></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    REGISTER STUDENT
                </button>

            </div>

        </form>

        <div class="footer">
            Student Registration Portal • Designed with elegance
        </div>

    </div>

    <script>
        document.getElementById("studentForm").addEventListener("submit", function(event) {

            event.preventDefault();

            alert("Student registration submitted successfully! ✓");

            this.reset();
        });
    </script>

</body>
</html>
